services:
  postgres:
    image: postgres
    container_name: aibot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ahmet1990.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    container_name: aibot_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aibot_qdrant_vector_db
    restart: unless-stopped
    ports:
      # HTTP API (host 7333 -> container 6333) — 6333 başka projede kullanımda
      - "7333:6333"
      # gRPC API (host 7334 -> container 6334)
      - "7334:6334"
    volumes:
      # Verileri kalıcı tutmak için
      - qdrant_storage:/qdrant/storage:z
      # Snapshot'lar için
      - qdrant_snapshots:/qdrant/snapshots:z
    environment:
      # Servis ayarları
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      
      # Telemetry'yi kapat (opsiyonel)
      QDRANT__TELEMETRY_DISABLED: "true"
      
      # Log seviyesi (debug, info, warn, error)
      QDRANT__LOG_LEVEL: info
      
      # API Key ile güvenlik (production için önerilen)
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key-here"
      
      # Storage optimizasyonu
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch for Jaeger storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: elasticsearch
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      # Kibana UI
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - LOG_LEVEL=info
    ports:
      # Jaeger agent accept zipkin.thrift
      - "5775:5775/udp"
      # Jaeger agent accept compact thrift protocol
      - "6831:6831/udp"
      # Jaeger agent accept jaeger thrift protocol
      - "6832:6832/udp"
      # Jaeger agent accept HTTP
      - "5778:5778"
      # Serve frontend
      - "16686:16686"
      # OTLP gRPC receiver — uygulamanın OpenTelemetry exporter'ı bu porta yazar
      - "4317:4317"
      # OTLP HTTP receiver
      - "4318:4318"
      # Collect jaeger.thrift
      - "14250:14250"
      # Collect jaeger.thrift over HTTP
      - "14268:14268"
      # Collect zipkin.thrift over HTTP
      - "9411:9411"
      # Admin/health check port
      - "14269:14269"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
  elasticsearch_data: