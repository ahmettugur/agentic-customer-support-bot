<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — Customer Support Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 32px 28px;
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 4px;
            color: #0f172a;
        }
        .login-card .subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 24px;
        }
        .login-form label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            margin-bottom: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .login-form button {
            width: 100%;
            padding: 11px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        .login-form button:hover:not(:disabled) { background: #4338ca; }
        .login-form button:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .login-error.visible { display: block; }
        .login-footer {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <h1>Yönetici Girişi</h1>
        <p class="subtitle">Customer Support Bot — Admin Panel</p>

        <div class="login-error" id="loginError"></div>

        <form class="login-form" id="loginForm" autocomplete="off">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username" value="admin">

            <label for="password">Parola</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" value="Admin123!">

            <button type="submit" id="loginBtn">Giriş Yap</button>
        </form>

        <p class="login-footer">JWT Bearer auth · Access 60dk · Refresh 14g</p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        (function () {
            // Zaten oturum varsa, return URL'e ya da admin'e yönlendir.
            const params = new URLSearchParams(location.search);
            const returnTo = params.get('return') || '/admin.html';
            if (window.Auth.getAccessToken()) {
                location.replace(returnTo);
                return;
            }

            const form = document.getElementById('loginForm');
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.classList.remove('visible');
                errEl.textContent = '';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                if (!username || !password) return;

                btn.disabled = true;
                btn.textContent = 'Giriş yapılıyor…';
                try {
                    await window.Auth.login(username, password);
                    location.replace(returnTo);
                } catch (err) {
                    errEl.textContent = err.message?.includes('401')
                        ? 'Kullanıcı adı veya parola hatalı.'
                        : (err.message || 'Giriş başarısız.');
                    errEl.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = 'Giriş Yap';
                }
            });
        })();
    </script>
</body>
</html>
