# Yerel geliştirme yığını.
#
# Güvenlik notları:
#   - Tüm portlar yalnızca 127.0.0.1'e bağlanır: Redis, Elasticsearch/Kibana ve Qdrant burada
#     kimlik doğrulamasız çalışır; 0.0.0.0'a açılmaları aynı ağdaki herkese erişim verirdi.
#     Bu dosya üretim için DEĞİLDİR — paylaşımlı/uzak bir ortamda Redis requirepass,
#     Qdrant API key ve Elasticsearch xpack.security açılmalıdır.
#   - Gizli değerler deploy/.env dosyasından okunur (git'e girmez); şablon: deploy/.env.example.
#   - Langfuse (LLM gözlemlenebilirliği) yığının parçasıdır: uygulama span'leri otel-collector'a
#     (host 4327) gider, collector bunları Jaeger'a ve Langfuse'a dağıtır. Arayüz: http://localhost:3000
#     Langfuse değişkenleri deploy/.env'de tanımlı olmalıdır (şablon: deploy/.env.example). Ayrıntı: docs/langfuse.md

# Langfuse web ve worker'ın ortak ortamı. Uygulamanın Postgres ve Redis'ini paylaşır, ama ayrı yerlerde:
#   - Postgres: aynı sunucuda ayrı "langfuse" veritabanı (uygulama CustomerSupportDb'yi kullanır).
#   - Redis: 1 numaralı veritabanı (uygulama 0'ı kullanır). Langfuse kuyruğu "noeviction" ister; uygulamanın
#     Redis'inde maxmemory sınırı olmadığı için varsayılan politika zaten noeviction'dır.
# ClickHouse ve MinIO Langfuse'a özgüdür (olay deposu ve ham yükleme deposu); yığında karşılıkları yok.
x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT tanımlı değil - bkz. deploy/.env.example}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY tanımlı değil (openssl rand -hex 32) - bkz. deploy/.env.example}
  # Langfuse'un kendi ürün telemetrisini (vendor'a anonim kullanım verisi) kapatır.
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD tanımlı değil - bkz. deploy/.env.example}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD tanımlı değil - bkz. deploy/.env.example}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_CONNECTION_STRING: redis://redis:6379/1

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  postgres:
    image: postgres:latest
    container_name: aibot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı değil - deploy/.env.example dosyasını deploy/.env olarak kopyalayın}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: aibot_redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aibot_qdrant_vector_db
    restart: unless-stopped
    ports:
      # HTTP API (host 7333 -> container 6333) — 6333 başka projede kullanımda
      - "127.0.0.1:7333:6333"
      # gRPC API (host 7334 -> container 6334)
      - "127.0.0.1:7334:6334"
    volumes:
      # Verileri kalıcı tutmak için
      - qdrant_storage:/qdrant/storage
      # Snapshot'lar için
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      # Servis ayarları
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      
      # Telemetry'yi kapat (opsiyonel)
      QDRANT__TELEMETRY_DISABLED: "true"
      
      # Log seviyesi (debug, info, warn, error)
      QDRANT__LOG_LEVEL: info
      
      # API Key ile güvenlik (production için önerilen)
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key-here"
      
      # Storage optimizasyonu
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch for Jaeger storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: aibot_elasticsearch
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: aibot_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      # Kibana UI
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # OpenTelemetry Collector — uygulamanın tek OTLP ucu (Telemetry:Otlp:Endpoint = http://localhost:4327).
  # Span'leri iki hedefe dağıtır: Jaeger (tümü, prompt içeriği silinmiş) ve Langfuse (ajan/LLM span'leri).
  # Yapılandırma: otel-collector-config.yaml. Contrib imajı: basicauth, filter, attributes ve nop bileşenleri
  # core imajda yok. İmaj distroless'tır (curl yok) — sağlık: http://localhost:13133/
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aibot_otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      # OTLP gRPC receiver (host 4327 → container 4317)
      - "127.0.0.1:4327:4317"
      # OTLP HTTP receiver (host 4328 → container 4318)
      - "127.0.0.1:4328:4318"
      # Health check endpoint
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY tanımlı değil - bkz. deploy/.env.example}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY tanımlı değil - bkz. deploy/.env.example}
      GOGC: "80"
    depends_on:
      jaeger:
        condition: service_started
      langfuse-web:
        condition: service_started

  # Prometheus — uygulama metriklerini (token, maliyet, gecikme, workflow sonucu, HTTP) collector'dan çeker.
  # Alarm kuralları: prometheus-alerts.yml (bildirim kanalı yok; http://localhost:9090/alerts).
  prometheus:
    image: prom/prometheus:latest
    container_name: aibot_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  # Grafana — Prometheus veri kaynağı ve "Customer Support Bot — Genel" panosu hazır gelir (grafana/ klasörü).
  grafana:
    image: grafana/grafana:latest
    container_name: aibot_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD tanımlı değil - bkz. deploy/.env.example}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: aibot_jaeger
    restart: unless-stopped
    command: ["--config", "/jaeger/config.yaml"]
    volumes:
      - ./jaeger-v2-config.yaml:/jaeger/config.yaml:ro
    ports:
      # Jaeger UI
      - "127.0.0.1:16686:16686"
      # OTLP gRPC receiver
      - "127.0.0.1:4317:4317"
      # OTLP HTTP receiver
      - "127.0.0.1:4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mailpit — yerel SMTP test sunucusu: uygulamanın gönderdiği e-postalar (onay sonucu, sipariş
  # kargolandı/teslim edildi, bütçe uyarısı) dışarı çıkmaz, web arayüzünde görünür.
  # Uygulama ayarı: Email:Enabled=true, Email:FromAddress, Email:Smtp:Host=localhost,
  # Email:Smtp:Port=1025, Email:Smtp:Security=None. Postalar bellekte tutulur (yeniden başlatınca silinir).
  # Sürüm entegrasyon testlerindeki (Adapters.Email.Tests) ile aynı.
  mailpit:
    image: axllent/mailpit:latest
    container_name: aibot_mailpit
    restart: unless-stopped
    ports:
      # SMTP
      - "127.0.0.1:1025:1025"
      # Web arayüzü
      - "127.0.0.1:8025:8025"


  # ─── Langfuse — LLM gözlemlenebilirliği (arayüz: http://localhost:3000) ───────────────────
  # Organizasyon, proje, API anahtarları ve ilk kullanıcı "headless init" ile İLK açılışta oluşturulur;
  # collector aynı anahtarlarla (Basic Auth) span gönderir — elle anahtar üretmek gerekmez.
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:latest
    container_name: aibot_langfuse_web
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET tanımlı değil - bkz. deploy/.env.example}
      LANGFUSE_INIT_ORG_ID: customer-support
      LANGFUSE_INIT_ORG_NAME: Customer Support
      LANGFUSE_INIT_PROJECT_ID: customer-support-bot
      LANGFUSE_INIT_PROJECT_NAME: CustomerSupportBot
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL tanımlı değil - bkz. deploy/.env.example}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD tanımlı değil - bkz. deploy/.env.example}
      # Tek kullanıcılı yerel kurulum: açık kayıt formunu kapatır.
      AUTH_DISABLE_SIGNUP: "true"

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:latest
    container_name: aibot_langfuse_worker
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aibot_langfuse_clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: aibot_langfuse_minio
    restart: unless-stopped
    entrypoint: sh
    # 'langfuse' bucket'ını sunucu açılmadan önce oluşturur.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
