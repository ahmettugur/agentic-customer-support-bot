# Yerel geliştirme yığını.
#
# Güvenlik notları:
#   - Tüm portlar yalnızca 127.0.0.1'e bağlanır: Redis, Elasticsearch/Kibana ve Qdrant burada
#     kimlik doğrulamasız çalışır; 0.0.0.0'a açılmaları aynı ağdaki herkese erişim verirdi.
#     Bu dosya üretim için DEĞİLDİR — paylaşımlı/uzak bir ortamda Redis requirepass,
#     Qdrant API key ve Elasticsearch xpack.security açılmalıdır.
#   - Gizli değerler deploy/.env dosyasından okunur (git'e girmez); şablon: deploy/.env.example.
#   - İmajlar sabit sürümlere bağlıdır: "latest" bir sonraki pull'da ana sürüm atlatıp
#     (ör. Postgres veri dizini uyumsuzluğu) yığını sessizce bozabilir.

services:
  postgres:
    image: postgres:latest
    container_name: aibot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı değil - deploy/.env.example dosyasını deploy/.env olarak kopyalayın}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: aibot_redis
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aibot_qdrant_vector_db
    restart: unless-stopped
    ports:
      # HTTP API (host 7333 -> container 6333) — 6333 başka projede kullanımda
      - "127.0.0.1:7333:6333"
      # gRPC API (host 7334 -> container 6334)
      - "127.0.0.1:7334:6334"
    volumes:
      # Verileri kalıcı tutmak için
      - qdrant_storage:/qdrant/storage
      # Snapshot'lar için
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      # Servis ayarları
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      
      # Telemetry'yi kapat (opsiyonel)
      QDRANT__TELEMETRY_DISABLED: "true"
      
      # Log seviyesi (debug, info, warn, error)
      QDRANT__LOG_LEVEL: info
      
      # API Key ile güvenlik (production için önerilen)
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key-here"
      
      # Storage optimizasyonu
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch for Jaeger storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: aibot_elasticsearch
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: aibot_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      # Kibana UI
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # OpenTelemetry Collector (opsiyonel — Jaeger v2 zaten OTLP alabilir)
  # Jaeger ile aynı anda çalıştırılacaksa farklı host portları kullanılmalı.
  otel-collector:
    image: otel/opentelemetry-collector:nightly
    container_name: aibot_otel-collector
    restart: unless-stopped
    profiles: ["otel"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      # OTLP gRPC receiver (host 4327 → container 4317)
      - "127.0.0.1:4327:4317"
      # OTLP HTTP receiver (host 4328 → container 4318)
      - "127.0.0.1:4328:4318"
      # Health check endpoint
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - GOGC=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: aibot_jaeger
    restart: unless-stopped
    command: ["--config", "/jaeger/config.yaml"]
    volumes:
      - ./jaeger-v2-config.yaml:/jaeger/config.yaml:ro
    ports:
      # Jaeger UI
      - "127.0.0.1:16686:16686"
      # OTLP gRPC receiver
      - "127.0.0.1:4317:4317"
      # OTLP HTTP receiver
      - "127.0.0.1:4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Mailpit — yerel SMTP test sunucusu: uygulamanın gönderdiği e-postalar (onay sonucu, sipariş
  # kargolandı/teslim edildi, bütçe uyarısı) dışarı çıkmaz, web arayüzünde görünür.
  # Uygulama ayarı: Email:Enabled=true, Email:FromAddress, Email:Smtp:Host=localhost,
  # Email:Smtp:Port=1025, Email:Smtp:Security=None. Postalar bellekte tutulur (yeniden başlatınca silinir).
  # Sürüm entegrasyon testlerindeki (Adapters.Email.Tests) ile aynı.
  mailpit:
    image: axllent/mailpit:latest
    container_name: aibot_mailpit
    restart: unless-stopped
    ports:
      # SMTP
      - "127.0.0.1:1025:1025"
      # Web arayüzü
      - "127.0.0.1:8025:8025"

  # coturn — sesli görüşmede (temsilci ↔ müşteri, WebRTC) NAT/kurumsal ağ arkasındaki taraflar için röle.
  # Kimlik: TURN REST API (use-auth-secret); API kısa ömürlü kullanıcı/parola üretir (VoiceCall:Turn).
  # static-auth-secret (turnserver.conf), appsettings'teki VoiceCall:Turn:SharedSecret ile aynı olmalı.
  coturn:
    image: coturn/coturn:latest
    container_name: aibot_coturn
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"


volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
  elasticsearch_data: