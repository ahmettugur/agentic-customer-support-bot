services:
  postgres:
    image: postgres
    container_name: aibot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ahmet1990.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    container_name: aibot_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aibot_qdrant_vector_db
    restart: unless-stopped
    ports:
      # HTTP API (host 7333 -> container 6333) — 6333 başka projede kullanımda
      - "7333:6333"
      # gRPC API (host 7334 -> container 6334)
      - "7334:6334"
    volumes:
      # Verileri kalıcı tutmak için
      - qdrant_storage:/qdrant/storage
      # Snapshot'lar için
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      # Servis ayarları
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      
      # Telemetry'yi kapat (opsiyonel)
      QDRANT__TELEMETRY_DISABLED: "true"
      
      # Log seviyesi (debug, info, warn, error)
      QDRANT__LOG_LEVEL: info
      
      # API Key ile güvenlik (production için önerilen)
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key-here"
      
      # Storage optimizasyonu
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch for Jaeger storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: aibot_elasticsearch
    environment:
      - cluster.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: aibot_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      # Kibana UI
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # OpenTelemetry Collector (opsiyonel — Jaeger v2 zaten OTLP alabilir)
  # Jaeger ile aynı anda çalıştırılacaksa farklı host portları kullanılmalı.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aibot_otel-collector
    restart: unless-stopped
    profiles: ["otel"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      # OTLP gRPC receiver (host 4327 → container 4317)
      - "4327:4317"
      # OTLP HTTP receiver (host 4328 → container 4318)
      - "4328:4318"
      # Health check endpoint
      - "13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - GOGC=80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: aibot_jaeger
    restart: unless-stopped
    command: ["--config", "/jaeger/config.yaml"]
    volumes:
      - ./jaeger-v2-config.yaml:/jaeger/config.yaml:ro
    ports:
      # Jaeger UI
      - "16686:16686"
      # OTLP gRPC receiver
      - "4317:4317"
      # OTLP HTTP receiver
      - "4318:4318"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python Code Sandbox — Agent'ın ürettiği kodu izole ortamda çalıştırır
  sandbox:
    image: python:3.12-slim
    container_name: aibot_sandbox
    restart: unless-stopped
    working_dir: /sandbox
    # pandas, numpy, scipy, matplotlib, openpyxl kurulu; HTTP API olarak bekler
    command: >
      sh -c "pip install --quiet fastapi uvicorn pandas numpy scipy matplotlib openpyxl seaborn scikit-learn &&
             uvicorn sandbox_api:app --host 0.0.0.0 --port 8100"
    ports:
      - "8100:8100"
    volumes:
      # Sandbox API kodu ve geçici dosya yükleme dizini (repo kökü — compose.yml deploy/ altında)
      - ../sandbox:/sandbox
    environment:
      # CPU/bellek limitlerini uygulama seviyesinde bildir
      - MAX_EXECUTION_SECONDS=30
      - MAX_UPLOAD_MB=50
    # Ağ erişimini kısıtla — sadece iç ağ (diğer servislerle konuşamaz)
    networks:
      - sandbox_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  sandbox_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
  elasticsearch_data: