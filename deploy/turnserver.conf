# Yerel geliştirme TURN sunucusu (aibot_coturn). Üretimde: gerçek external-ip, TLS (5349) ve güçlü sır.
# static-auth-secret, API'nin VoiceCall:Turn:SharedSecret ayarıyla aynı olmalı (yerel geliştirme değeri).
listening-port=3478
realm=aibot.local
use-auth-secret
static-auth-secret=aibot-dev-turn-secret
min-port=49160
max-port=49200
external-ip=127.0.0.1
fingerprint
no-tls
log-file=stdout
pidfile=/var/tmp/turnserver.pid
