# OpenTelemetry Collector Configuration
# This configuration file enables trace collection from the AI.Api application
# and exports traces to Jaeger for visualization

receivers:
  # OTLP gRPC receiver for receiving traces from applications
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor to group traces before exporting
  batch:
    send_batch_size: 512
    timeout: 5s
    send_batch_max_size: 2048

  # Memory limiter to prevent OOMKilled
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor — kaynak (resource) niteliklerini YALNIZCA eksikse ekler.
  #
  # Eskiden "attributes" işlemcisi service.name'i "upsert" ediyordu: o işlemci span
  # niteliklerine yazar, resource'a değil; her span'e uygulamanın gerçek adıyla
  # (CustomerSupportBot) çelişen "AI.Api" değerini zorla basıyordu. "insert" mevcut değeri
  # korur, yalnızca adını bildirmeyen bir kaynak için varsayılan sağlar.
  resource:
    attributes:
      - key: service.name
        value: CustomerSupportBot
        action: insert
      - key: deployment.environment.name
        value: development
        action: insert

exporters:
  # OTLP gRPC exporter to send traces to Jaeger
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Debug exporter — pipeline'a VARSAYILAN OLARAK BAĞLI DEĞİL. "detailed" ayrıntı düzeyi her
  # span'in tüm niteliklerini (kullanıcı sorguları, tool parametreleri) collector stdout'una
  # döküyordu; loglar bu verilerin saklanması için tasarlanmamış bir yüzeydir. Hata ayıklarken
  # geçici olarak traces.exporters listesine eklenebilir.
  debug:
    verbosity: basic

service:
  pipelines:
    # Traces pipeline configuration
    # Sıra: memory_limiter ilk (aşırı yükte veriyi en erken reddetmek için), batch son.
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp]

  # Extensions for health checks
  extensions: [health_check]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
