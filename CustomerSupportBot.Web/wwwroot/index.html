<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Müşteri Destek Asistanı</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CustomerSupportBot.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" style="display:none;color-scheme:light only;background:lightyellow;bottom:0;box-shadow:0 -1px 2px rgba(0,0,0,.2);box-sizing:border-box;left:0;padding:.6rem 1.25rem .7rem 1.25rem;position:fixed;width:100%;z-index:1000;">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" style="cursor:pointer;position:absolute;right:.75rem;top:.5rem;">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.loadScript = function (src, id) {
            return new Promise(function (resolve, reject) {
                if (id && document.getElementById(id)) { resolve(); return; }
                var s = document.createElement('script');
                s.src = src;
                if (id) s.id = id;
                s.onload = resolve;
                s.onerror = function () { reject(new Error('Script load failed: ' + src)); };
                document.body.appendChild(s);
            });
        };
    </script>
</body>

</html>
