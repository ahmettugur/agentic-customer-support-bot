<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Destek Asistanı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Sohbetler</h2>
                <button class="btn-icon" id="newChatBtn" title="Yeni sohbet">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14" />
                        <path d="M5 12h14" />
                    </svg>
                </button>
            </div>
            <div class="sidebar-list" id="sessionList">
                <div class="sidebar-empty">Henüz konuşma yok</div>
            </div>
        </aside>

        <!-- CHAT PANEL -->
        <div class="chat-panel">

            <!-- HEADER -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="btn-icon sidebar-toggle" id="sidebarToggle" title="Menü">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" x2="20" y1="12" y2="12" />
                            <line x1="4" x2="20" y1="6" y2="6" />
                            <line x1="4" x2="20" y1="18" y2="18" />
                        </svg>
                    </button>
                    <div class="header-avatar">
                        <img src="images/chatbot.png" alt="Asistan" />
                    </div>
                    <div class="header-info">
                        <h1>Müşteri Destek Asistanı</h1>
                        <div class="header-status">
                            <span class="status-dot"></span>
                            <span>Çevrimiçi</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- MESAJLAR -->
            <main class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z" />
                        </svg>
                    </div>
                    <h2>Merhaba, hoş geldiniz!</h2>
                    <p>Size nasıl yardımcı olabilirim? Aşağıdaki konulardan birini seçebilir veya doğrudan sorunuzu
                        yazabilirsiniz.</p>
                    <div class="examples">
                        <button class="example-chip" data-text="Dell XPS 15 hakkında bilgi verir misiniz?">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.3-4.3" />
                            </svg>
                            Ürün bilgisi
                        </button>
                        <button class="example-chip" data-text="2 adet Apple iPhone 15 Pro sipariş vermek istiyorum">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="8" cy="21" r="1" />
                                <circle cx="19" cy="21" r="1" />
                                <path
                                    d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                            </svg>
                            Sipariş ver
                        </button>
                        <button class="example-chip" data-text="ORD-1 numaralı siparişimin durumu nedir?">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14" />
                                <path d="m7.5 4.27 9 5.15" />
                                <polyline points="3.29 7 12 12 20.71 7" />
                                <line x1="12" x2="12" y1="22" y2="12" />
                                <path d="m17 13 5 5m-5 0 5-5" />
                            </svg>
                            Sipariş durumu
                        </button>
                        <button class="example-chip" data-text="ORD-2 siparişim çok geç geldi, şikayet etmek istiyorum">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                            </svg>
                            Şikayet bildirimi
                        </button>
                    </div>
                </div>
            </main>

            <!-- INPUT ALANI -->
            <footer class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Bir mesaj yazın..." autocomplete="off" />
                    <button id="voiceBtn" title="Sesli konuşma" aria-label="Sesli konuşmayı başlat" class="btn-voice">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="2" width="6" height="12" rx="3" />
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                    </button>
                    <button id="sendBtn" title="Gönder" aria-label="Mesaj gönder">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18.168-8.215a.5.5 0 0 0 0-.904z" />
                            <path d="M6 12h16" />
                        </svg>
                    </button>
                </div>
                <div id="voiceStatus" class="voice-status" hidden>
                    <span class="voice-pulse"></span>
                    <span id="voiceStatusText">Bağlanıyor…</span>
                    <button id="voiceInterruptBtn" class="voice-mini" title="Asistanı kes">⏸</button>
                </div>
                <p class="input-hint">Yapay zeka destekli yanıtlar bilgilendirme amaçlıdır.</p>
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="js/chat-api-client.js"></script>
    <script src="js/chat-ui.js"></script>
    <script src="js/realtime-client.js"></script>
    <script src="js/app.js"></script>
    <script src="js/realtime-ui.js"></script>
</body>

</html>

<!-- 
ORD-1 için iade istiyorum, 6 aydır sürekli hatalı ürün geliyor
Sony WH-1000XM5 kulaklıktan 1 adet sipariş ver, müşteri kodum CUST-1990
ORD-1 nerede ve ORD-2 için şikayet aç
-->
